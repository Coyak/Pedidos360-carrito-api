# Configuración del Puerto del Servidor
server.port=8081

# Nombre de la Aplicación
spring.application.name=carrito-api

# Configuración de OAuth2 / Resource Server con Microsoft Entra ID (Azure AD)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://sts.windows.net/e5372bf0-c5e3-4286-887c-79069f209c1f/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/discovery/v2.0/keys

# Conexión a RabbitMQ Broker
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360_pass}

# Topología Centralizada de Mensajería Pedidos360
pedidos360.rabbitmq.exchange.pedidos=pedidos.exchange
pedidos360.rabbitmq.exchange.dlx=pedidos.dlx.exchange
pedidos360.rabbitmq.queue.procesamiento=pedidos.procesamiento.queue
pedidos360.rabbitmq.queue.dlq=pedidos.dlq.queue
pedidos360.rabbitmq.routing-key.creado=pedidos.pedido.creado
pedidos360.rabbitmq.routing-key.dlq=pedidos.pedido.dlq
